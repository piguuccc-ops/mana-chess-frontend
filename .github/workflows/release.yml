# A version tag (git tag v1.0.0 && git push --tags) also makes a GitHub release with the game as
# one HTML file, a ready-to-run zip of the page server for running without Docker, and the Android
# app (APK). Signing key and default server for the app: see android/README.md.
name: Release files

on:
  push:
    tags: ['v*']

permissions:
  contents: write              # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Android app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MANA_BACKEND: ${{ vars.MANA_BACKEND }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE="$RUNNER_TEMP/release.keystore"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throwaway key and cannot be updated by later releases (see android/README.md)."
            unset KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          fi
          # the version from the tag: v1.2.3 → 1.2.3, code 10203 (always higher for a newer version)
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION_NAME%%-*}"
          export VERSION_NAME VERSION_CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          bash android/build.sh
          rm -f "$RUNNER_TEMP/release.keystore"
      - name: Package
        run: |
          mkdir -p out/mana-chess-frontend
          cp dist/frontend.mjs dist/mana-chess.html release/Start.bat release/start.sh release/README.txt out/mana-chess-frontend/
          cp LICENSE out/mana-chess-frontend/LICENSE.txt
          chmod +x out/mana-chess-frontend/start.sh
          (cd out && zip -r "../mana-chess-frontend-${GITHUB_REF_NAME}.zip" mana-chess-frontend)
          cp dist/mana-chess.html mana-chess.html
          cp android/build/mana-chess.apk "mana-chess-${GITHUB_REF_NAME}.apk"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "mana-chess-frontend-${GITHUB_REF_NAME}.zip" mana-chess.html "mana-chess-${GITHUB_REF_NAME}.apk" --title "$GITHUB_REF_NAME" --generate-notes

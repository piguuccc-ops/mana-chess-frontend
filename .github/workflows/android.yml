# The Android app on demand (Actions → Android app → Run workflow) and for every change to it:
# builds the APK and keeps it as a downloadable artifact for two weeks. Releases come with the
# APK anyway (release.yml).
name: Android app

on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Game page
        run: npm run build
      - name: APK
        env:
          # pull requests from forks get no secrets: they build with a throwaway key
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MANA_BACKEND: ${{ vars.MANA_BACKEND }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE="$RUNNER_TEMP/release.keystore"
          else
            unset KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          fi
          export VERSION_CODE="$GITHUB_RUN_NUMBER" VERSION_NAME="dev-${GITHUB_SHA::7}"
          bash android/build.sh
          rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: mana-chess-apk
          path: android/build/mana-chess.apk
          retention-days: 14
